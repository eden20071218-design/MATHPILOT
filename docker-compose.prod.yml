# Optional HTTPS entry point. Review docs/student-web.md before deploying.
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      MATHPILOT_DOMAIN: ${MATHPILOT_DOMAIN:?Set MATHPILOT_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
